type = "c"
message = "Revamp the index sets overview on System > Indices as a paginated entity table."

details.user = """
The index sets overview is now a paginated, sortable and filterable table instead of a card list. It shows a card per
index set category with counts, the number of streams routed to each index set, and cached cluster metrics such as
size, document count and deflector health. You can apply field type profiles to several index sets at once and expand
a row to see its associated streams.

The previous list endpoint is deprecated.
"""

