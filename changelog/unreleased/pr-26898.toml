type = "f"
message = "Fail the AWS Kinesis/CloudWatch input instead of retrying forever when AWS denies a required permission."

issues = ["Graylog2/graylog-plugin-enterprise#15073"]
pulls = ["26898"]

details.user = """
When the IAM role used by an AWS Kinesis/CloudWatch input was missing a required DynamoDB permission, the input logged an authorization error every few seconds indefinitely while consuming no records, and still reported as running. It now stops after a few consecutive denials and reports a failure naming the denied action and resource, so the missing permission can be granted and the input started again.
"""
